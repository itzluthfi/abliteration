name: Abliteration Security Audit

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    # Run audit weekly every Monday at 00:00 UTC
    - cron: '0 0 * * 1'
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Target URL to Audit'
        required: true
        default: 'https://example.com'

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Abliteration Security Audit
      run: |
        python abliteration.py -u "${{ github.event.inputs.target_url || 'https://example.com' }}" --fail-on HIGH

    - name: Upload Security Audit Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: abliteration-audit-reports
        path: |
          OUTPUT/audit_report.html
          OUTPUT/audit_report.json
